<!--
  Kando Onboarding Wizard - Leave Credits Initialization
  Self-contained: inline CSS + vanilla JS, no external dependencies.
-->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Kando · Leave Credits Initialization</title>
  <style>
    :root {
      --teal: #20c997;
      --teal-dark: #17a882;
      --ink: #2c3e50;
      --white: #ffffff;
      --border: rgba(60, 60, 60, 0.12);
      --gray-bg: #f7f9fb;
      --gray-text: #6b7785;
      --error: #e03131;
      --info: #2f6fb0;
      --info-bg: #eaf2fb;
      --radius: 12px;
      --shadow: 0 10px 30px rgba(44, 62, 80, 0.08);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      background: var(--gray-bg);
      color: var(--ink);
      line-height: 1.5;
      min-height: 100vh;
      display: flex;
      align-items: flex-start;
      justify-content: center;
      padding: 48px 20px;
    }
    .wizard {
      width: 100%;
      max-width: 840px;
      background: var(--white);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      overflow: hidden;
    }
    .wizard-header { padding: 32px 40px 24px; border-bottom: 1px solid var(--border); }
    .brand {
      display: flex; align-items: center; gap: 10px;
      font-weight: 700; font-size: 15px; letter-spacing: 0.02em;
      color: var(--teal); margin-bottom: 18px;
    }
    .brand-dot {
      width: 26px; height: 26px; background: var(--teal); border-radius: 8px;
      display: inline-flex; align-items: center; justify-content: center;
      color: #fff; font-size: 15px;
    }
    .wizard-title {
      display: flex; align-items: center; gap: 12px;
      font-size: 24px; font-weight: 700; color: var(--ink);
    }
    .wizard-title .emoji { font-size: 28px; }

    .progress-wrap { padding: 24px 40px 0; }
    .progress-label { font-size: 13px; font-weight: 600; color: var(--gray-text); margin-bottom: 8px; }
    .progress-track { height: 8px; background: #eef1f4; border-radius: 100px; overflow: hidden; }
    .progress-fill {
      height: 100%; background: var(--teal); width: 25%; border-radius: 100px;
      transition: width 0.4s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .wizard-body { padding: 32px 40px; min-height: 320px; }
    .step { animation: fadeIn 0.3s ease; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
    .step-heading { font-size: 20px; font-weight: 700; margin-bottom: 10px; }
    .step-sub { color: var(--gray-text); font-size: 15px; margin-bottom: 24px; }

    .intro-illustration { font-size: 56px; text-align: center; margin: 8px 0 20px; }
    .intro-card {
      background: var(--gray-bg); border: 1px solid var(--border);
      border-radius: var(--radius); padding: 20px 24px; margin-top: 16px;
    }
    .intro-card ul { list-style: none; }
    .intro-card li { display: flex; gap: 10px; padding: 6px 0; font-size: 14px; color: var(--ink); }
    .intro-card li::before { content: "✓"; color: var(--teal); font-weight: 700; }

    /* ---------- Toolbar / field ---------- */
    .toolbar {
      display: flex; justify-content: space-between; align-items: center;
      margin-bottom: 16px; flex-wrap: wrap; gap: 10px;
    }
    .count-pill {
      background: rgba(32, 201, 151, 0.12); color: var(--teal-dark);
      padding: 5px 14px; border-radius: 100px; font-size: 13px; font-weight: 600;
    }
    .field { margin-bottom: 20px; }
    .field label { display: block; font-size: 14px; font-weight: 600; margin-bottom: 8px; }
    .field select, .field input {
      width: 100%; padding: 12px 14px; font-family: inherit; font-size: 15px;
      color: var(--ink); background: var(--white);
      border: 1.5px solid var(--border); border-radius: 10px;
    }
    .field select:focus, .field input:focus { outline: none; border-color: var(--teal); box-shadow: 0 0 0 4px rgba(32, 201, 151, 0.12); }
    .field-row { display: flex; gap: 18px; }
    .field-row .field { flex: 1; }

    /* ---------- Employee table ---------- */
    .emp-table-wrap { border: 1px solid var(--border); border-radius: var(--radius); overflow: hidden; }
    .emp-table { width: 100%; border-collapse: collapse; font-size: 14px; }
    .emp-table th {
      text-align: left; background: var(--gray-bg); padding: 12px 16px; font-size: 12px;
      color: var(--gray-text); text-transform: uppercase; letter-spacing: 0.03em; font-weight: 700;
      border-bottom: 1px solid var(--border);
    }
    .emp-table td { padding: 12px 16px; border-bottom: 1px solid var(--border); vertical-align: middle; }
    .emp-table tr:last-child td { border-bottom: none; }
    .emp-table tr:hover td { background: var(--gray-bg); }
    .emp-name-cell { display: flex; align-items: center; gap: 10px; }
    .assign-avatar {
      width: 30px; height: 30px; border-radius: 50%; background: var(--gray-bg);
      display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 12px;
      color: var(--teal-dark); flex-shrink: 0; border: 1px solid var(--border);
    }
    .checkbox {
      appearance: none; -webkit-appearance: none;
      width: 20px; height: 20px; flex-shrink: 0;
      border: 2px solid #cbd3da; border-radius: 6px;
      cursor: pointer; position: relative; transition: all 0.2s;
    }
    .checkbox:checked { background: var(--teal); border-color: var(--teal); }
    .checkbox:checked::after {
      content: ""; position: absolute; left: 5px; top: 1px;
      width: 6px; height: 10px; border: solid #fff;
      border-width: 0 2px 2px 0; transform: rotate(45deg);
    }
    .balance-input {
      width: 84px; padding: 7px 8px; font-family: inherit; font-size: 14px;
      border: 1.5px solid var(--border); border-radius: 8px; text-align: right;
    }
    .balance-input:focus { outline: none; border-color: var(--teal); box-shadow: 0 0 0 3px rgba(32,201,151,0.12); }
    .balance-input:disabled { background: #f0f2f4; color: var(--gray-text); cursor: not-allowed; }
    .override-tag {
      font-size: 10px; font-weight: 700; color: var(--info); background: var(--info-bg);
      padding: 2px 6px; border-radius: 100px; margin-left: 6px; vertical-align: middle;
    }
    .source-note { font-size: 12px; color: var(--gray-text); margin-top: 10px; }

    /* ---------- Preview totals ---------- */
    .totals-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; margin-bottom: 22px; }
    .total-card {
      border: 1px solid var(--border); border-radius: var(--radius); padding: 18px; text-align: center;
    }
    .total-card .t-value { font-size: 26px; font-weight: 800; color: var(--teal-dark); }
    .total-card .t-label { font-size: 12px; color: var(--gray-text); margin-top: 4px; }

    .done-illustration { font-size: 56px; text-align: center; margin: 12px 0; }
    .summary-row {
      display: flex; justify-content: space-between; padding: 14px 20px;
      border-bottom: 1px solid var(--border); font-size: 15px;
    }
    .summary { border: 1px solid var(--border); border-radius: var(--radius); overflow: hidden; margin-bottom: 20px; }
    .summary-row:last-child { border-bottom: none; }
    .summary-row .k { color: var(--gray-text); font-weight: 500; }
    .summary-row .v { font-weight: 600; color: var(--ink); }
    .success-banner {
      display: none; background: rgba(32, 201, 151, 0.12); color: var(--teal-dark);
      border: 1px solid rgba(32, 201, 151, 0.3); border-radius: 10px;
      padding: 14px 18px; font-weight: 600; font-size: 14px; margin-top: 16px; text-align: center;
    }

    /* ---------- Footer ---------- */
    .wizard-footer {
      display: flex; justify-content: space-between; gap: 14px;
      padding: 20px 40px 32px; border-top: 1px solid var(--border);
    }
    .btn {
      padding: 12px 28px; font-family: inherit; font-size: 15px; font-weight: 600;
      border-radius: 10px; border: 1.5px solid transparent; cursor: pointer;
      transition: background 0.2s, border-color 0.2s, opacity 0.2s;
    }
    .btn-primary { background: var(--teal); color: #fff; }
    .btn-primary:hover { background: var(--teal-dark); }
    .btn-primary:disabled { background: #cbd3da; cursor: not-allowed; }
    .btn-secondary { background: var(--white); color: var(--gray-text); border-color: var(--border); }
    .btn-secondary:hover { background: var(--gray-bg); }
    .btn-secondary:disabled { opacity: 0.4; cursor: not-allowed; }
    .btn-link {
      background: transparent; color: var(--teal); border: none; font-size: 14px;
      padding: 10px 0; cursor: pointer; text-decoration: none; transition: color 0.2s;
    }
    .btn-link:hover { color: var(--teal-dark); text-decoration: underline; }

    @media (max-width: 768px) {
      body { padding: 24px 12px; }
      .wizard-header, .wizard-body, .wizard-footer, .progress-wrap { padding-left: 24px; padding-right: 24px; }
      .field-row { flex-direction: column; gap: 0; }
      .totals-grid { grid-template-columns: 1fr; }
      .emp-table-wrap { overflow-x: auto; }
      .emp-table { min-width: 560px; }
    }
    @media (max-width: 480px) {
      .wizard-footer { flex-direction: column-reverse; }
      .btn { width: 100%; }
      .wizard-title { font-size: 20px; }
    }
  </style>
</head>
<body>
  <main class="wizard" role="form" aria-label="Leave Credits Initialization Wizard">
    <header class="wizard-header">
      <div class="brand"><span class="brand-dot">K</span> KANDO HRMS</div>
      <h1 class="wizard-title"><span class="emoji">🎁</span> Leave Credits Initialization</h1>
    </header>

    <div class="progress-wrap">
      <div class="progress-label" id="progressLabel">Step 1 of 4</div>
      <div class="progress-track"><div class="progress-fill" id="progressFill"></div></div>
    </div>

    <section class="wizard-body" id="wizardBody"></section>

    <footer class="wizard-footer">
      <button class="btn btn-link" onclick="backToHub()" title="Return to wizard selection">↩ Back to Hub</button>
      <div style="display: flex; gap: 8px;">
        <button class="btn btn-secondary" id="backBtn" disabled>← Back</button>
        <button class="btn btn-primary" id="nextBtn">Next →</button>
      </div>
    </footer>
  </main>

  <script>
    /* =========================================================
       Leave Credits Initialization Wizard
       ========================================================= */
    const TOTAL_STEPS = 4;
    let currentStep = 1;

    const LEAVE_TYPES = [
      { id: 'vacation', name: 'Vacation Leave', policyDays: 15 },
      { id: 'sick', name: 'Sick Leave', policyDays: 15 },
      { id: 'bereavement', name: 'Bereavement Leave', policyDays: 5 },
      { id: 'emergency', name: 'Emergency Leave', policyDays: 3 }
    ];

    const EMPLOYEES = [
      { name: 'Maria Santos', dept: 'Finance', hireDate: '2022-03-14' },
      { name: 'Juan Dela Cruz', dept: 'Operations', hireDate: '2023-07-01' },
      { name: 'Angela Reyes', dept: 'Human Resources', hireDate: '2021-11-20' },
      { name: 'Mark Villanueva', dept: 'IT', hireDate: '2024-01-09' },
      { name: 'Kristine Bautista', dept: 'Sales', hireDate: '2020-05-18' },
      { name: 'Paolo Garcia', dept: 'Marketing', hireDate: '2023-09-25' },
      { name: 'Liza Fernandez', dept: 'Finance', hireDate: '2019-02-11' },
      { name: 'Ramon Torres', dept: 'IT', hireDate: '2024-06-03' }
    ];

    const data = {
      leaveTypeId: 'vacation',
      effectiveDate: '',
      selectedIdx: EMPLOYEES.map((_, i) => i),
      balances: EMPLOYEES.map(() => null), // null = use policy default
      overrides: EMPLOYEES.map(() => false)
    };

    const body = document.getElementById('wizardBody');
    const backBtn = document.getElementById('backBtn');
    const nextBtn = document.getElementById('nextBtn');
    const progressFill = document.getElementById('progressFill');
    const progressLabel = document.getElementById('progressLabel');

    function backToHub() { window.location.href = 'index.html'; }
    function escapeHtml(s) {
      return String(s).replace(/[&<>"']/g, c => ({
        '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
      }[c]));
    }
    function initials(name) { return name.split(' ').map(p => p[0]).slice(0, 2).join('').toUpperCase(); }
    function selectedLeaveType() { return LEAVE_TYPES.find(l => l.id === data.leaveTypeId); }
    function policyDefault() { return selectedLeaveType()?.policyDays ?? 0; }
    function balanceFor(i) { return data.overrides[i] ? data.balances[i] : policyDefault(); }
    function formatDate(iso) {
      if (!iso) return '—';
      const d = new Date(iso + 'T00:00:00');
      return d.toLocaleDateString('en-US', { year: 'numeric', month: 'long', day: 'numeric' });
    }

    /* ----- Step 1: Welcome ----- */
    function renderStep1() {
      return `
        <div class="step">
          <div class="intro-illustration">🎁</div>
          <h2 class="step-heading">Initialize Leave Credits</h2>
          <p class="step-sub">Grant employees their starting leave balance based on your accrual policy — or set a manual override for specific employees (e.g., mid-year hires or migrated balances).</p>
          <div class="intro-card">
            <ul>
              <li>Select which employees to initialize</li>
              <li>Balances default to the leave policy, editable per employee</li>
              <li>Preview totals before applying</li>
            </ul>
          </div>
        </div>`;
    }

    /* ----- Step 2: Show employees + selection + leave type ----- */
    function renderStep2() {
      const rows = EMPLOYEES.map((e, i) => `
        <tr>
          <td><input type="checkbox" class="checkbox" data-role="select" data-idx="${i}" ${data.selectedIdx.includes(i) ? 'checked' : ''} /></td>
          <td>
            <div class="emp-name-cell">
              <div class="assign-avatar">${initials(e.name)}</div>
              <span>${escapeHtml(e.name)}</span>
            </div>
          </td>
          <td>${escapeHtml(e.dept)}</td>
          <td>${formatDate(e.hireDate)}</td>
        </tr>`).join('');
      return `
        <div class="step">
          <h2 class="step-heading">Select Leave Type &amp; Employees</h2>
          <p class="step-sub">Choose the leave type to initialize, then pick which employees are included.</p>

          <div class="field-row">
            <div class="field">
              <label>Leave Type</label>
              <select id="f_leaveType">
                ${LEAVE_TYPES.map(l => `<option value="${l.id}" ${data.leaveTypeId === l.id ? 'selected' : ''}>${escapeHtml(l.name)} (policy default: ${l.policyDays} days)</option>`).join('')}
              </select>
            </div>
            <div class="field">
              <label>Effective Date</label>
              <input type="date" id="f_effective" value="${data.effectiveDate}" />
            </div>
          </div>

          <div class="toolbar">
            <span class="count-pill" id="countPill">${data.selectedIdx.length} of ${EMPLOYEES.length} selected</span>
            <button class="btn-link" id="toggleAllBtn" style="background:none;border:none;color:var(--teal);cursor:pointer;font-size:13px;font-weight:600;">
              ${data.selectedIdx.length === EMPLOYEES.length ? 'Deselect All' : 'Select All'}
            </button>
          </div>

          <div class="emp-table-wrap">
            <table class="emp-table">
              <thead><tr><th></th><th>Employee</th><th>Department</th><th>Hire Date</th></tr></thead>
              <tbody>${rows}</tbody>
            </table>
          </div>
        </div>`;
    }

    function wireStep2() {
      document.getElementById('f_leaveType').addEventListener('change', (e) => {
        data.leaveTypeId = e.target.value;
      });
      document.getElementById('f_effective').addEventListener('change', (e) => {
        data.effectiveDate = e.target.value;
      });
      body.querySelectorAll('[data-role="select"]').forEach(cb => {
        cb.addEventListener('change', () => {
          const idx = +cb.dataset.idx;
          if (cb.checked) {
            if (!data.selectedIdx.includes(idx)) data.selectedIdx.push(idx);
          } else {
            data.selectedIdx = data.selectedIdx.filter(i => i !== idx);
          }
          render();
        });
      });
      document.getElementById('toggleAllBtn').addEventListener('click', () => {
        data.selectedIdx = data.selectedIdx.length === EMPLOYEES.length ? [] : EMPLOYEES.map((_, i) => i);
        render();
      });
    }

    /* ----- Step 3: Calculate / preview balances (editable) ----- */
    function renderStep3() {
      const rows = data.selectedIdx.map(i => {
        const e = EMPLOYEES[i];
        const bal = balanceFor(i);
        return `
        <tr>
          <td>
            <div class="emp-name-cell">
              <div class="assign-avatar">${initials(e.name)}</div>
              <span>${escapeHtml(e.name)}</span>
            </div>
          </td>
          <td>${escapeHtml(e.dept)}</td>
          <td>
            <input type="number" class="balance-input" min="0" step="0.5" data-idx="${i}" value="${bal}" />
            ${data.overrides[i] ? '<span class="override-tag">OVERRIDE</span>' : ''}
          </td>
        </tr>`;
      }).join('');
      return `
        <div class="step">
          <h2 class="step-heading">Calculate &amp; Preview Balances</h2>
          <p class="step-sub">Balances default to the <strong>${escapeHtml(selectedLeaveType()?.name)}</strong> policy (${policyDefault()} days). Edit any value to override for that employee.</p>
          <div class="emp-table-wrap">
            <table class="emp-table">
              <thead><tr><th>Employee</th><th>Department</th><th>Initial Balance (days)</th></tr></thead>
              <tbody>${rows}</tbody>
            </table>
          </div>
          <p class="source-note">Balances are calculated from the assigned leave policy unless manually overridden.</p>
        </div>`;
    }

    function wireStep3() {
      body.querySelectorAll('.balance-input').forEach(input => {
        input.addEventListener('input', () => {
          const idx = +input.dataset.idx;
          const val = parseFloat(input.value);
          data.overrides[idx] = true;
          data.balances[idx] = isNaN(val) ? 0 : val;
          const tagHost = input.parentElement;
          if (!tagHost.querySelector('.override-tag')) {
            const tag = document.createElement('span');
            tag.className = 'override-tag';
            tag.textContent = 'OVERRIDE';
            tagHost.appendChild(tag);
          }
        });
      });
    }

    /* ----- Step 4: Initialize / Confirm ----- */
    function renderStep4() {
      const total = data.selectedIdx.reduce((sum, i) => sum + balanceFor(i), 0);
      const overrideCount = data.selectedIdx.filter(i => data.overrides[i]).length;
      const avg = data.selectedIdx.length ? (total / data.selectedIdx.length) : 0;
      return `
        <div class="step">
          <div class="done-illustration">✅</div>
          <h2 class="step-heading">Preview &amp; Initialize</h2>
          <p class="step-sub">Review the totals below before granting leave credits.</p>

          <div class="totals-grid">
            <div class="total-card">
              <div class="t-value">${data.selectedIdx.length}</div>
              <div class="t-label">Employees</div>
            </div>
            <div class="total-card">
              <div class="t-value">${total.toFixed(1)}</div>
              <div class="t-label">Total Days Granted</div>
            </div>
            <div class="total-card">
              <div class="t-value">${avg.toFixed(1)}</div>
              <div class="t-label">Average Days / Employee</div>
            </div>
          </div>

          <div class="summary">
            <div class="summary-row"><span class="k">Leave Type</span><span class="v">${escapeHtml(selectedLeaveType()?.name)}</span></div>
            <div class="summary-row"><span class="k">Effective Date</span><span class="v">${formatDate(data.effectiveDate)}</span></div>
            <div class="summary-row"><span class="k">Manual Overrides</span><span class="v">${overrideCount} employee${overrideCount === 1 ? '' : 's'}</span></div>
          </div>

          <div class="success-banner" id="successBanner">🎉 Leave credits initialized successfully!</div>
        </div>`;
    }

    /* ----- Render controller ----- */
    function render() {
      if (currentStep === 1) body.innerHTML = renderStep1();
      else if (currentStep === 2) { body.innerHTML = renderStep2(); wireStep2(); }
      else if (currentStep === 3) { body.innerHTML = renderStep3(); wireStep3(); }
      else body.innerHTML = renderStep4();

      progressFill.style.width = (currentStep / TOTAL_STEPS * 100) + '%';
      progressLabel.textContent = `Step ${currentStep} of ${TOTAL_STEPS}`;

      backBtn.disabled = currentStep === 1;
      nextBtn.textContent = currentStep === TOTAL_STEPS ? 'Confirm & Initialize' : 'Next →';
      updateNextState();
    }

    function updateNextState() {
      if (currentStep === 2) nextBtn.disabled = data.selectedIdx.length === 0 || data.effectiveDate === '';
      else nextBtn.disabled = false;
    }

    /* ----- Navigation ----- */
    nextBtn.addEventListener('click', () => {
      if (currentStep === 2 && (data.selectedIdx.length === 0 || data.effectiveDate === '')) return;
      if (currentStep === TOTAL_STEPS) {
        const banner = document.getElementById('successBanner');
        if (banner) banner.style.display = 'block';
        nextBtn.disabled = true;
        nextBtn.textContent = 'Initialized ✓';
        return;
      }
      currentStep++;
      render();
    });
    backBtn.addEventListener('click', () => { if (currentStep > 1) { currentStep--; render(); } });

    render();
  </script>
</body>
</html>
